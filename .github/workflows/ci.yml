name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium (the Studio's own end-to-end test)
        run: npx playwright install --with-deps chromium

      - name: Install the desktop lane's tools (pdf, a virtual display, X11 input, capture)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils xvfb xdotool imagemagick

      # The desktop steps are proved, not mocked: under Xvfb the OS backend really moves the
      # pointer and really writes a PNG, and the test reads the file back.
      - name: Tests (type-check, unit, desktop I/O, chromium E2E, UI E2E, robot protocol)
        run: xvfb-run -a npm test
        env:
          # The mail test skips itself when no SMTP server is reachable, which is the case in CI.
          CI: 'true'

      - name: The same headless suites under Jest and Vitest
        run: xvfb-run -a npm run test:runners
        env:
          CI: 'true'

  naming:
    name: Naming policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: No third-party product names in the tree
        run: |
          python3 - <<'PY'
          import pathlib, sys

          # Assembled from fragments on purpose: this workflow must not contain the names it bans.
          banned = ["ui" + "path", "re" + "framework", "robotic " + "enterprise", "action " + "center"]
          hits = []
          for path in pathlib.Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or 'node_modules' in path.parts:
                  continue
              try:
                  text = path.read_text()
              except (UnicodeDecodeError, OSError):
                  continue
              lowered = text.lower()
              for term in banned:
                  if term in lowered:
                      hits.append(f"{path}: {term}")
          if hits:
              print("\n".join(hits))
              sys.exit(1)
          print("clean: no third-party product names")
          PY
